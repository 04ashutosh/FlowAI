spring:
  application:
    name: flowai-backend

  # Profile activation - defaults to 'local'
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

  # --- JPA ---
  jpa:
    hibernate:
      ddl-auto: validate   # IMPORTANT: Flyway owns the schema. Hibernate ONLY validates.
    show-sql: false        # Set to true temporarily when debugging SQL issues
    open-in-view: false    # Anti-pattern. Always keep this false.
    properties:
      hibernate:
        format_sql: true

  # --- Flyway ---
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

# --- Actuator ---
management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics
  endpoint:
    health:
      show-details: when-authorized

# --- Logging ---
logging:
  level:
    com.flowai: DEBUG           # Our code: verbose during development
    org.springframework: INFO
    org.hibernate.SQL: WARN     # Suppress SQL unless debugging
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

server:
  port: 8085
  error:
    include-message: always   # Include error messages in error responses
    include-binding-errors: always

# --- JWT ---
application:
  security:
    jwt:
      secret-key: ${JWT_SECRET:this-is-a-local-dev-secret-key-change-in-production-must-be-256-bits}
      expiration-ms: ${JWT_EXPIRATION_MS:86400000}   # 24 hours