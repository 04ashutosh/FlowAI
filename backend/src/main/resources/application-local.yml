spring:
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: flowai-sync-group
      auto-offset-reset: earliest
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
  datasource:
    url: jdbc:postgresql://${FLOWAI_DB_HOST:localhost}:${FLOWAI_DB_PORT:5435}/${FLOWAI_DB_NAME:flowai_db}
    username: ${FLOWAI_DB_USER:flowai_user}
    password: ${FLOWAI_DB_PASSWORD:flowai_local_pass}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: FlowAI-HikariPool
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  jpa:
    show-sql: true   # Show SQL in local development only

logging:
  level:
    com.flowai: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE

# --- JWT override for local dev ---
application:
  security:
    jwt:
      secret-key: local-dev-super-secret-key-at-least-256-bits-long-padding-padding-padding
      expiration-ms: 86400000
ollama:
  model: llama3
