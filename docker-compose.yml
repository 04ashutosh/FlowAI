version: '3.8'

services:
  flowai-postgres:
    image: postgres:16-alpine
    container_name: flowai-postgres
    environment:
      POSTGRES_DB: flowaidb
      POSTGRES_USER: flowai_user
      POSTGRES_PASSWORD: flowai_password
    ports:
      - "5435:5432"
    volumes:
      - flowai_pgdata:/var/lib/postgresql/data
    networks:
      - flowai-net

  source-postgres:
    image: postgres:16-alpine
    container_name: source-postgres
    environment:
      POSTGRES_DB: source_db
      POSTGRES_USER: source_user
      POSTGRES_PASSWORD: source_pass
    ports:
      - "5436:5432"
    volumes:
      - source_pgdata:/var/lib/postgresql/data
    networks:
      - flowai-net

  kafka:
    image: apache/kafka:latest
    container_name: flowai-kafka
    ports:
      - "9094:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    networks:
      - flowai-net

  backend:
    build:
      context: ./backend
    container_name: flowai-backend
    ports:
      - "8085:8085"
    depends_on:
      - flowai-postgres
      - kafka
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - flowai-net

  frontend:
    build:
      context: ./frontend
    container_name: flowai-frontend
    ports:
      - "4200:80"
    depends_on:
      - backend
    networks:
      - flowai-net

volumes:
  flowai_pgdata:
  source_pgdata:

networks:
  flowai-net:
    driver: bridge
